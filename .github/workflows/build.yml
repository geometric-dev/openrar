name: CI Build & Test

on:
  push:
    # 'v2.*' covers long-lived release branches (v2.1, v2.2, ...). A push to v2.1 used to run
    # nothing, so a release branch could be tagged without a single CI leg having seen it.
    branches: [ master, v2, 'v2.*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, v2 ]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR: a second push within the
# ~9-minute matrix window replaces the first, halving feedback latency and
# removing queue noise (commit-and-pray mitigation, v1.22.0).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default-deny. Only release-assets widens this (it needs contents/id-token/
# attestations: write to publish and attest). Previously no workflow-level
# default existed, so every other job inherited the repository default, which
# for older repos is a read-write GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  roadmap-lint:
    # v1.44 M3: anchor lint as a pre-tag gate (CI wiring additive per plan §5).
    # Fails the build if roadmap file:line anchors no longer resolve, the
    # v1.44 verification ledger drifts from recomputation, or docs/FMM.md
    # range disjointness is violated.
    name: Roadmap anchor lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run anchor lint
        run: python3 tools/anchor_lint.py --release v1.44
      - name: Run test assertion integrity lint
        run: |
          python3 tools/test_assertion_lint.py --selftest
          python3 tools/test_assertion_lint.py

  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})${{ matrix.arch_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cxx: g++
            build_type: Release
            arch: x64
            arch_suffix: ""
            cmake_arch: ""
            dll_suffix: ""
            # Gate leg: only this leg fails on warnings (-Werror) and runs the
            # clang-format check; see CONTRIBUTING.md §Warnings/§Formatting.
            warnings_as_errors: true
            format_check: true
          - os: ubuntu-24.04
            compiler: clang
            cxx: clang++
            build_type: Release
            arch: x64
            arch_suffix: ""
            cmake_arch: ""
            dll_suffix: ""
          # The first universal attempt never passed an arch list, so on an
          # arm64 runner the "universal" artifact was arm64-only and Intel Macs
          # could not run it. The leg now builds with
          # CMAKE_OSX_ARCHITECTURES="arm64;x86_64" and asserts both slices with
          # lipo before anything is published.
          - os: macos-latest
            compiler: clang
            cxx: clang++
            build_type: Release
            arch: universal
            arch_suffix: ""
            cmake_arch: ""
            dll_suffix: ""
          - os: windows-2022
            compiler: msvc
            cxx: cl
            build_type: Release
            arch: x64
            arch_suffix: " (x64)"
            cmake_arch: "x64"
            dll_suffix: "_x64"
          - os: windows-2022
            compiler: msvc-arm64
            cxx: cl
            build_type: Release
            arch: arm64
            arch_suffix: " (arm64)"
            cmake_arch: "ARM64"
            dll_suffix: "_arm64"
            # x64 host cross-compiling for ARM64: these artifacts cannot run
            # here, so the test/benchmark steps are skipped. Keyed off this flag
            # rather than the arch name so the arm64-native macOS leg still runs
            # its tests (it used to be gated on arch == 'arm64').
            cross_compiled: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Ninja (Linux/macOS)
        if: runner.os != 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          WARN_FLAG=""
          if [ "${{ matrix.warnings_as_errors }}" = "true" ]; then WARN_FLAG="-DOPENRAR_WARNINGS_AS_ERRORS=ON"; fi
          # One fat build for both Mac architectures: Intel Macs have no
          # other way to run the release artifact. An array, not a string, so
          # the quote survives the semicolon (CMake reads it as its arch list)
          # and the other legs pass no argument at all.
          ARCH_ARGS=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARCH_ARGS+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64")
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DOPENRAR_DLL_SUFFIX=${{ matrix.dll_suffix }} \
            -DOPENRAR_INMEM_ARCHIVE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${ARCH_ARGS[@]}" \
            $WARN_FLAG

      - name: Formatting check (clang-format, gate leg only)
        if: matrix.format_check == true
        run: |
          if ! command -v clang-format-18 &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y clang-format-18 || sudo apt-get install -y clang-format
          fi
          CF=$(command -v clang-format-18 || command -v clang-format)
          $CF --version
          find src include tests -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | \
            xargs $CF --dry-run --Werror

      - name: Layer direction check (gate leg only)
        # ARCHITECTURE.md section 2: downward-only includes. Ratchet: new
        # violations fail; accepted ones live in tools/layer_baseline.json,
        # updated manually only (see docs/verification-legs.md).
        if: matrix.format_check == true
        run: python3 tools/layer_check.py

      - name: Install clang-tidy (gate leg only)
        if: matrix.format_check == true
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Static analysis & naming check (clang-tidy, gate leg only)
        # CONTRIBUTING.md "Code style": static analysis (bugprone, cert, performance,
        # clang-analyzer) and readability-identifier-naming via the repository .clang-tidy,
        # over the TUs this build compiled.
        if: matrix.format_check == true
        run: bash tools/clang_tidy_check.sh build

      - name: Version consistency check (gate leg only)
        if: matrix.format_check == true
        shell: bash
        run: |
          python tools/bump_version.py --check



      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -DOPENRAR_DLL_SUFFIX=${{ matrix.dll_suffix }} -DOPENRAR_INMEM_ARCHIVE=ON

      - name: Build All Targets
        run: |
          cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Verify universal2 binaries (macOS)
        # The 2.4.0 artifact was published as "universal" while being arm64
        # only. Asserting both slices here makes that class of silent drift a
        # red build instead of a support claim nobody checks.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for bin in ./build/openrar ./build/libopenrar.dylib; do
            if [ ! -e "$bin" ]; then
              echo "::error::$bin not found"
              status=1
              continue
            fi
            info="$(lipo -info "$bin")"
            echo "$info"
            for want in arm64 x86_64; do
              if ! grep -q "$want" <<<"$info"; then
                echo "::error::$bin is missing the $want slice (not universal2)"
                status=1
              fi
            done
          done
          exit $status

      - name: Verify the Intel slice carries the AVX-512 and GFNI kernels
        # Being fat is not enough: 2.4.0 shipped a universal zip whose x86_64
        # slice silently lacked these kernels - first because multi-arch builds
        # switched them off, then because enablement keyed off the runner's host
        # CPU. Thin the slice and assert the kernel symbols are actually in it.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          symbols=(match_length_avx512_kernel blake2sp_update_bulk_avx512 rs16_fold_gfni)
          status=0
          for bin in ./build/openrar ./build/libopenrar.dylib; do
            if [ ! -e "$bin" ]; then
              echo "::error::$bin not found"
              status=1
              continue
            fi
            # mktemp -d is portable (BSD's -t template rules differ from GNU's)
            thin="$(mktemp -d)/$(basename "$bin").x86_64" || exit 1
            if ! lipo -thin x86_64 -output "$thin" "$bin"; then
              echo "::error::$bin has no x86_64 slice to inspect"
              rm -f "$thin"
              status=1
              continue
            fi
            for sym in "${symbols[@]}"; do
              if grep -aq "$sym" "$thin"; then
                echo "$bin [x86_64]: $sym present"
              else
                echo "::error::$bin x86_64 slice is missing $sym (kernel not compiled in)"
                status=1
              fi
            done
            rm -rf "$(dirname "$thin")"
          done
          exit $status

      - name: Verify DLL artifact exists
        shell: bash
        run: |
          echo "Checking for openrar shared library (arch=${{ matrix.arch }}, suffix=${{ matrix.dll_suffix }})..."
          ls -lh build/openrar*.dll build/*.so build/*.dylib build/Release/openrar*.dll 2>&1 || true
          ls -lh build/libopenrar.* 2>&1 || true
          # At least one shared lib must exist (suffix-aware)
          SUFFIX="${{ matrix.dll_suffix }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f build/openrar${SUFFIX}.dll || test -f build/Release/openrar${SUFFIX}.dll || test -f build/openrar.dll || test -f build/Release/openrar.dll
          elif [ "${{ runner.os }}" = "macOS" ]; then
            test -f build/libopenrar${SUFFIX}.dylib || test -f build/libopenrar.dylib || test -f build/openrar${SUFFIX}.dylib
          else
            test -f build/libopenrar${SUFFIX}.so || test -f build/libopenrar.so || test -f build/openrar${SUFFIX}.so
          fi
          echo "DLL artifact verified."

      - name: Run Unit Test Suite (CTest)
        # Windows ARM64 is a cross-compile leg (x64 host): ARM64 exes cannot
        # execute there, so test execution is limited to other legs. aarch64
        # Linux coverage runs under QEMU in the dedicated job below.
        if: matrix.cross_compiled != true
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Aggregate JUnit report (v1.45 M0 gate)
        # v1.45 M0 gate 4: every ctest lane produces a machine-readable JUnit
        # file via the fail-closed aggregator (test_runner LastTest.log tags).
        # --min-tests makes a silent loss of registered suites fail the lane
        # rather than emit a shallow-green report. The artifact upload below
        # mirrors the lane name so run-over-run regressions are diffable per
        # matrix entry.
        if: matrix.cross_compiled != true && always()
        run: python tools/ctest_to_junit.py --log build/Testing/Temporary/LastTest.log --out build/junit-report.xml --min-tests 20

      - name: Upload JUnit report
        if: matrix.cross_compiled != true && always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: build/junit-report.xml
          if-no-files-found: error
          retention-days: 3

      - name: Kernel throughput report (native hardware, informational)
        # Real AVX2/SSE2/NEON hardware numbers across all native platforms.
        # Informational throughput report with median-of-passes protocol;
        # --quick bounds execution time to ~10-15s per runner.
        if: matrix.cross_compiled != true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            BENCH_EXE="./build/${{ matrix.build_type }}/openrar_bench.exe"
            if [ ! -f "$BENCH_EXE" ]; then BENCH_EXE="./build/Release/openrar_bench.exe"; fi
            if [ ! -f "$BENCH_EXE" ]; then BENCH_EXE="./build/openrar_bench.exe"; fi
          else
            BENCH_EXE="./build/openrar_bench"
          fi
          $BENCH_EXE --quick

      - name: Interop Gate (local spec, no rar.exe in CI)
        if: matrix.cross_compiled != true
        shell: bash
        run: |
          # No rar.exe in CI; the gate degrades to self-roundtrip + two-block probe
          # + compress_tests on its own. It is authoritative here: a gate failure
          # must fail CI (no `|| weaker-check` fallback).
          python tools/interop_gate.py --quick

      - name: CLI Smoke Test (Archive Creation & Extraction)
        if: matrix.cross_compiled != true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="./build/openrar64/${{ matrix.build_type }}/openrar.exe"
          else
            EXE="./build/openrar"
          fi
          
          # Verify help output
          $EXE
          
          # Verify version output
          $EXE --version
          
          # Create test archive
          mkdir -p ci_test_data
          echo "OpenRAR Cross-Platform CI Payload 12345" > ci_test_data/hello.txt
          $EXE a -plain ci_test.rar ci_test_data
          
          # Test archive integrity
          $EXE t -plain ci_test.rar
          
          # Extract archive
          mkdir -p ci_out
          $EXE x -plain ci_test.rar ci_out/
          
          # Verify extracted content
          diff -u ci_test_data/hello.txt ci_out/ci_test_data/hello.txt
          echo "Cross-platform CLI smoke test PASSED!"

      - name: CLI Benchmark & Hardware Sanity Check (Native Silicon)
        # Real hardware validation gate: invokes shipping openrar binary directly.
        # Automatically detects host CPU topology and vector acceleration (AVX-512,
        # AVX2, SSE2, Apple Silicon NEON, GFNI), benchmarks in-memory RAR5 compression
        # & multi-threaded decompression, calculates thread scaling, and gates on
        # bit-exact CRC32 verification (decompression_verified: true).
        if: matrix.cross_compiled != true
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE="./build/openrar64/${{ matrix.build_type }}/openrar.exe"
          else
            EXE="./build/openrar"
          fi
          
          echo "=== 1. CLI Version & Hardware Topology Disclosure ==="
          $EXE --version
          
          echo "=== 2. Real-Hardware Multi-Threaded In-Memory Benchmark ==="
          $EXE b --seconds=1 -plain
          
          echo "=== 3. Benchmark RFC 8259 JSON Verification Gate ==="
          $EXE b --seconds=1 --json > benchmark_result.json
          cat benchmark_result.json
          
          # Gate: decompression integrity must be verified bit-exact
          grep -q '"decompression_verified": true' benchmark_result.json || {
            echo "::error::Decompression integrity verification failed in benchmark JSON"
            exit 1
          }
          echo "Native hardware benchmark & sanity check PASSED!"

      - name: Build CPack Debian package (Linux gcc Release)
        if: startsWith(matrix.os, 'ubuntu') && matrix.compiler == 'gcc'
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B build
          ls -la build/*.deb

      - name: Run Node writer suites (full run, R2)
        # Full tools/tests suite runs on Ubuntu gcc Release using the freshly built binary.
        # Self-test, self-extraction and structural asserts run without redundant VM spin-up.
        if: startsWith(matrix.os, 'ubuntu') && matrix.compiler == 'gcc'
        run: node tools/run-tests.cjs

      - name: Stage canonical shared-library name
        # SDK consumers load the library as `openrar` (openrar.dll /
        # libopenrar.so / libopenrar.dylib). CI builds the arch-suffixed DLL for
        # side-by-side installs, so publish the canonical name beside it: each
        # release zip holds one architecture, so the copy cannot collide, and
        # nobody has to rename a file to use the SDKs.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="${{ matrix.dll_suffix }}"
          # The Visual Studio generator writes the DLL beside the build root;
          # Ninja-style layouts use a per-config directory. Search instead of
          # hard-coding a path, so a layout change cannot silently break
          # staging (this step failed on both Windows legs looking only in
          # build/Release and build/openrar64/Release).
          SRC=$(find build -name "openrar${SUFFIX}.dll" -type f 2>/dev/null | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::openrar${SUFFIX}.dll not found; cannot stage the canonical openrar.dll"
            find build -maxdepth 2 -name 'openrar*.dll' -type f 2>/dev/null || true
            exit 1
          fi
          cp "$SRC" "$(dirname "$SRC")/openrar.dll"
          ls -l "$(dirname "$SRC")"/openrar*.dll

      - name: Upload native shared-library artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # "native", not "dll": the artifact carries whatever shared-library
          # form the platform builds (.dll / .so / .dylib) plus the CLI.
          name: openrar-native-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.arch }}
          path: |
            build/openrar*.dll
            build/Release/openrar*.dll
            build/libopenrar*.so
            build/libopenrar*.dylib
            build/openrar*.lib
            build/Release/openrar*.lib
            build/*.lib
            build/openrar64/Release/openrar.exe
            build/openrar64/openrar.exe
            build/openrar
            # The sandboxed worker ships beside the CLI (worker_exe_path()
            # resolves a sibling of the openrar binary); without it the CLI
            # degrades to in-process parsing and warns on stderr.
            build/openrar64/Release/openrar_worker.exe
            build/openrar64/${{ matrix.build_type }}/openrar_worker.exe
            build/${{ matrix.build_type }}/openrar_worker.exe
            build/openrar_worker.exe
            build/openrar_worker
            build/*.deb
          # error, not warn: the release-assets job zips whatever lands in the
          # artifact, so a silently-empty artifact would publish an empty
          # release zip with a green build (R1 silent-degradation class).
          if-no-files-found: error
          retention-days: 7

  linux-arm64-qemu:
    name: linux-arm64 (gcc cross, QEMU run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # cli_tests shells out to the CLI binary; under cross-compilation the
      # host kernel cannot exec an aarch64 ELF directly, so every invocation
      # goes through the user-mode emulator (see tests/unit/cli_tests.cpp).
      OPENRAR_RUNNER: "qemu-aarch64-static -L /usr/aarch64-linux-gnu"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Install aarch64 cross toolchain + QEMU
        run: |
          sudo apt-get update
          # The runner uses /usr/bin/qemu-aarch64-static, which only
          # qemu-user-static provides. The old fallback installed
          # qemu-user-binfmt (dynamic qemu-user + binfmt registrations), which
          # does NOT ship that path, so it could never satisfy the dependency
          # it was meant to rescue. Fall back to the dynamic emulator and give
          # it the static name the rest of the job expects, then verify.
          if ! sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user-static; then
            sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
            sudo ln -sf "$(command -v qemu-aarch64)" /usr/bin/qemu-aarch64-static
          fi
          command -v qemu-aarch64-static || { echo "::error::qemu-aarch64-static is not installed"; exit 1; }

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Configure (cross aarch64)
        # CMAKE_CROSSCOMPILING_EMULATOR makes add_test()-registered CTest
        # entries run each target binary under QEMU automatically.
        # Warnings-as-errors: the arm legs are the only place ILP32/ARM-only
        # code paths compile, so a truncation warning must fail loudly.
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_CROSSCOMPILING_EMULATOR="/usr/bin/qemu-aarch64-static;-L;/usr/aarch64-linux-gnu" \
            -DOPENRAR_WARNINGS_AS_ERRORS=ON \
            -DOPENRAR_INMEM_ARCHIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests under QEMU (aarch64 NEON / scalar paths)
        # In QEMU user-mode emulation on a 2-vCPU runner, threadpool synchronization
        # (parallel_compress_tests, two_phase_tests) causes severe TCG lock thrashing / deadlocks,
        # heavy multi-megabyte compression corpora (compress_tests, stream_encoder_tests, volume_tests)
        # stall software emulation, and child-process spawning (sfx_*, cli_tests) creates excessive emulation overhead.
        # Native multi-threading, large-scale compression, and process isolation on ARM64 are verified natively on Apple Silicon & Windows ARM64 runners.
        # Here we run the single-threaded in-process suites (crypto, recovery, format, bitreader, dll, etc.) with a 60s per-test timeout.
        run: |
          ctest --test-dir build -C Release --output-on-failure --timeout 60 \
            -E 'compress_tests|stream_encoder_tests|solid_packer_tests|volume_tests|benchmark_tests|file_handle_tests|mutation_tests|parallel_compress_tests|two_phase_tests|sfx_.*|cli_tests|collision_matrix_tests|extraction_report_tests|transcode_tests|foreign_format_tests|sandbox_.*|python_conformance|fuzz_.*'

      - name: Aggregate JUnit report (v1.45 M0 gate)
        if: always()
        run: python tools/ctest_to_junit.py --log build/Testing/Temporary/LastTest.log --out build/junit-report.xml --min-tests 20

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-qemu-aarch64
          path: build/junit-report.xml
          if-no-files-found: error
          retention-days: 3

      - name: Assert NEON RS16 kernel activated (not the scalar fallback)
        # Same R1 silent-degradation guard as the SDE GFNI gate: a build
        # misconfiguration that quietly compiles the kernel out must fail
        # loudly, not pass with both sides of the bit-exactness gate scalar.
        run: |
          QEMU="qemu-aarch64-static -L /usr/aarch64-linux-gnu"
          OUT=$($QEMU ./build/recovery_tests 2>&1)
          echo "$OUT" | grep -q "NEON KERNEL ACTIVE" || {
            echo "::error::NEON RS16 kernel did not activate under QEMU (scalar fallback ran)"
            echo "$OUT" | grep -A2 "test_rs16_neon_bit_exactness" || true
            exit 1
          }
          echo "NEON RS16 kernel activation confirmed on aarch64"

      - name: CLI smoke (create/test/extract under QEMU)
        run: |
          QEMU="qemu-aarch64-static -L /usr/aarch64-linux-gnu"
          mkdir -p arm_ci_data
          echo "OpenRAR aarch64 QEMU payload" > arm_ci_data/hello.txt
          $QEMU ./build/openrar a -plain arm_ci.rar arm_ci_data
          $QEMU ./build/openrar t -plain arm_ci.rar
          mkdir -p arm_ci_out
          $QEMU ./build/openrar x -plain arm_ci.rar arm_ci_out/
          diff -u arm_ci_data/hello.txt arm_ci_out/arm_ci_data/hello.txt
          echo "aarch64 QEMU smoke test PASSED!"

      - name: CLI Benchmark & Sanity Check (QEMU aarch64 Emulation)
        # Validates aarch64 binary execution under user-mode QEMU emulation.
        # Single-threaded mode (-mt1) avoids QEMU thread scheduling jitter
        # while verifying NEON instruction execution, in-memory compression/
        # decompression, and bit-exact CRC32 verification.
        run: |
          QEMU="qemu-aarch64-static -L /usr/aarch64-linux-gnu"
          echo "=== 1. aarch64 Version under QEMU ==="
          $QEMU ./build/openrar --version

          echo "=== 2. aarch64 In-Memory Benchmark under QEMU ==="
          $QEMU ./build/openrar b -mt1 --seconds=1 -plain

          echo "=== 3. aarch64 Benchmark JSON Verification Gate ==="
          $QEMU ./build/openrar b -mt1 --seconds=1 --json > arm_benchmark.json
          cat arm_benchmark.json
          grep -q '"decompression_verified": true' arm_benchmark.json || {
            echo "::error::Decompression integrity verification failed under QEMU benchmark"
            exit 1
          }
          echo "aarch64 QEMU benchmark & sanity check PASSED!"

      - name: Upload native shared-library artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrar-native-ubuntu-latest-gcc-arm64
          path: |
            build/libopenrar*.so
            build/openrar
          if-no-files-found: error
          retention-days: 7


  simd-validation:
    name: "SIMD kernels (native + Intel SDE: AVX-512, GFNI)"
    # The AVX-512 match kernel and GFNI RS16 fold kernel dispatch only where
    # the CPU reports the feature. GitHub runners cannot be assumed to have
    # either, so the kernels are validated under Intel SDE (Software
    # Development Emulator), which advertises the ISA to the process and
    # executes the instructions regardless of host silicon. The activation
    # greps below make the gate loud: if SDE did not advertise the ISA, or
    # the dispatcher/probe fell back to scalar, this job FAILS rather than
    # passing vacuously.
    runs-on: ubuntu-latest
    env:
      SDE_VERSION: "10.13.1"
      SDE_BUILD: "2026-07-28"
      SDE_ID: "924984"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DOPENRAR_INMEM_ARCHIVE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Native kernel gates (whatever this CPU supports)
        run: |
          ./build/recovery_tests
          ./build/compress_tests

      - name: Download Intel SDE (pinned version)
        run: |
          curl -fsSLO "https://downloadmirror.intel.com/${SDE_ID}/sde-external-${SDE_VERSION}-${SDE_BUILD}-lin.tar.xz"
          tar -xJf "sde-external-${SDE_VERSION}-${SDE_BUILD}-lin.tar.xz"
          SDE_DIR=$(find . -maxdepth 1 -type d -name 'sde-external-*' | head -1)
          test -x "${SDE_DIR}/sde64"
          echo "SDE_EXE=${SDE_DIR}/sde64" >> "$GITHUB_ENV"

      - name: Diagnostic — CPU features as seen under SDE
        run: |
          "${SDE_EXE}" -future -- ./build/compress_tests | head -4

      - name: GFNI RS16 fold kernel under SDE (must ACTIVATE and match scalar)
        run: |
          OPENRAR_GFNI_DIAG=1 "${SDE_EXE}" -future -- ./build/recovery_tests | tee sde_recovery.log
          grep -q "GFNI KERNEL ACTIVE" sde_recovery.log \
            || { echo "FAIL: GFNI kernel did not activate under SDE (probe fell back to scalar)"; exit 1; }

      - name: AVX-512 match kernel under SDE (must ACTIVATE and match scalar)
        run: |
          "${SDE_EXE}" -future -- ./build/compress_tests | tee sde_compress.log
          grep -q "avx512" sde_compress.log \
            || { echo "FAIL: AVX-512 match path absent under SDE"; exit 1; }

      - name: RS16 fold ratio under SDE (EMULATED — non-normative)
        # SDE emulates GFNI at a per-instruction cost very different from
        # silicon, so these ratios must NOT be read as native performance.
        # They only demonstrate the kernel does more work per instruction
        # than the scalar fold even under emulation. Native GFNI numbers
        # require Ice Lake+ hardware (none available in CI or locally).
        # v1.28: only the kernel suite runs under SDE (the full engine's
        # packing/extract suites are meaningless emulated and slow); the
        # consumer greps the v2 label name(kernel).
        run: |
          "${SDE_EXE}" -future -- ./build/openrar_bench --suite rs16_fold_dispatched | tee sde_bench.log
          grep -q "rs16_fold_dispatched(GFNI)" sde_bench.log \
            || { echo "FAIL: GFNI fold kernel did not dispatch under SDE"; exit 1; }

      - name: End-to-end .rev parity under SDE (CLI drives the GFNI kernel)
        # The full interop gate cannot run under SDE (it spawns cmake/shell
        # subprocesses that break SDE's exec tracking), so the end-to-end
        # check drives the CLI binary directly: create a volume set, generate
        # .rev parity (GFNI fold), destroy a volume, repair, verify bytes.
        run: |
          set -e
          mkdir -p sde_e2e && cd sde_e2e
          head -c 1048576 /dev/urandom > payload.bin
          ../build/openrar a -v256k -m0 set.part1.rar payload.bin
          ../build/openrar rv1 set.part1.rar
          test -f set.part1.rev
          cp set.part2.rar payload.copy
          rm set.part2.rar
          ../build/openrar r set.part1.rar
          cmp payload.copy set.part2.rar
          echo "End-to-end .rev generate/destroy/repair under SDE PASSED"

  wasm:
    name: WASM (Emscripten) — block codec + archive API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      # Pinned: the makefile + wasm/README.md document the same version.
      # Bump deliberately (build size/behaviour shifts), never by accident.
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: '3.1.50'
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - name: Configure WASM (block codec + archive API)
        run: |
          emcmake cmake --preset wasm
          emcmake cmake --preset wasm-archive
      - name: Build WASM
        run: |
          cmake --build --preset wasm --parallel
          cmake --build --preset wasm-archive --parallel
      - name: Contract check — required exports present on both modules
        run: node wasm/js/check-exports.mjs
      - name: Test — JS wrapper suites against the fresh build
        run: node --test wasm/js/test.mjs wasm/js/helpers.test.mjs wasm/js/archive.test.mjs wasm/js/worker.test.mjs
      - name: Assert WASM size budgets (§5.3 wasm-limitations.md)
        # Catch accidental binary bloat. Block codec ≤ 500 KiB (2× headroom),
        # archive module ≤ 1.5 MiB (spec §4 budget, currently ~120 KiB).
        run: |
          SIZE=$(stat -c %s wasm/js/dist/openrar.wasm)
          echo "openrar.wasm size: $SIZE bytes"
          if [ "$SIZE" -gt 512000 ]; then
            echo "FAIL: block codec wasm exceeds 500 KiB budget"
            exit 1
          fi
          ASIZE=$(stat -c %s wasm/js/dist/openrar_archive.wasm)
          echo "openrar_archive.wasm size: $ASIZE bytes"
          if [ "$ASIZE" -gt 1572864 ]; then
            echo "FAIL: archive wasm exceeds 1.5 MiB budget"
            exit 1
          fi
      - name: Pack npm tarball
        run: |
          npm pack wasm/js/ --pack-destination wasm/js/dist/
          ls -la wasm/js/dist/*.tgz
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrar-wasm
          path: wasm/js/dist/
          retention-days: 7

      - name: SIMD128 variant — configure & build (OPENRAR_WASM_SIMD=ON)
        # Opt-in kernel build: same sources with -msimd128, so the SIMD128
        # match finder in match_simd.hpp compiles in. Runs last because it
        # overwrites wasm/js/dist; baseline checks and artifacts already ran.
        run: |
          emcmake cmake -B build-simd -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENRAR_WASM_SIMD=ON
          cmake --build build-simd --parallel

      - name: SIMD128 variant — contract + JS suites + size budget
        # The JS suites drive the fresh SIMD module end-to-end (compress/
        # decompress roundtrips through the SIMD match finder). The baseline
        # archive module in dist is untouched, so its suites still run.
        run: |
          node wasm/js/check-exports.mjs
          node --test wasm/js/test.mjs wasm/js/helpers.test.mjs wasm/js/archive.test.mjs wasm/js/worker.test.mjs
          SIZE=$(stat -c %s wasm/js/dist/openrar.wasm)
          echo "openrar.wasm (simd128) size: $SIZE bytes"
          if [ "$SIZE" -gt 512000 ]; then
            echo "FAIL: simd128 block codec exceeds 500 KiB budget"
            exit 1
          fi

  windows-asan:
    # 2026-11 code-quality review, Tier-1 gap #2. Every sanitizer leg ran on
    # ubuntu-latest, so the Windows-only code paths — the NT anchored
    # containment opens (io/containment.cpp), win32_meta, sandbox spawn,
    # MOTW, the SFX GUI stub — had no dynamic memory checking at all.
    # cmake/sanitizers.cmake already supports /fsanitize=address on MSVC
    # (and fails closed on thread/memory); this job is the missing wiring.
    #
    # RelWithDebInfo, not Debug: CMake's Debug flags add /RTC1, which MSVC
    # rejects alongside /fsanitize=address. RelWithDebInfo keeps symbols and
    # avoids /RTC1 and /GL (openrar_flags.cmake adds /GL only to Release;
    # sanitizers.cmake forces /GL- and /LTCG:OFF for Release anyway).
    name: MSVC ASan (Windows, primary)
    # windows-2022, not windows-latest: the repository pins the
    # "Visual Studio 17 2022" generator (all three Windows legs do), and
    # windows-latest has moved to Visual Studio 18 (2026), where that generator
    # no longer resolves - CMake fails at project() with "could not find any
    # instance of Visual Studio" (run 43483376613).
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Configure (ASan, MSVC)
        shell: bash
        run: |
          cmake -B build-asan -G "Visual Studio 17 2022" -A x64 \
            -DOPENRAR_INMEM_ARCHIVE=ON \
            -DOPENRAR_SANITIZE=address
      - name: Build
        shell: bash
        run: cmake --build build-asan --config RelWithDebInfo --parallel
      - name: Put the ASan runtime on PATH
        # MSVC links clang_rt.asan_dynamic-x86_64.dll but does not copy it next
        # to the executable, and its directory is only on PATH inside a
        # developer prompt. Without this every test exits 0xC0000135
        # (DLL not found) before running a line of test code.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "vswhere found no VC toolset installation" }
          $runtime = Get-ChildItem -Path (Join-Path $vs 'VC\Tools\MSVC') -Recurse `
                       -Filter 'clang_rt.asan*_dynamic-x86_64.dll' -ErrorAction SilentlyContinue |
                     Select-Object -First 1
          if (-not $runtime) { throw "MSVC ASan runtime DLL not found under $vs" }
          Write-Host "ASan runtime: $($runtime.FullName)"
          "PATH=$($runtime.DirectoryName);$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Unit suite under MSVC ASan
        # Same exclusions as the Linux leg, for the same reasons (spawn-based
        # suites, non-instrumented python host, transcode wall-clock budget).
        # detect_leaks=0: LeakSanitizer does not exist on Windows; leaving it
        # on only produces a startup warning per process.
        shell: bash
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        run: |
          ctest --test-dir build-asan -C RelWithDebInfo --output-on-failure \
            --exclude-regex 'transcode_tests|sfx_tests|sfx_pipeline_tests|sfx_e2e_tests|sandbox_sandboxed_e2e_tests|python_conformance'
      - name: Aggregate JUnit report
        if: always()
        shell: bash
        run: python tools/ctest_to_junit.py --log build-asan/Testing/Temporary/LastTest.log --out build-asan/junit-report.xml --min-tests 20
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-windows-asan
          path: build-asan/junit-report.xml
          if-no-files-found: error
          retention-days: 3

  sanitizers:
    # v1.30 M5 (SECURITY_ARCHITECTURE §7.2): ASan + UBSan are PRIMARY legs —
    # the full unit suite under both sanitizers on one Linux leg.
    name: ASan + UBSan (primary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (ASan + UBSan)
        run: |
          cmake -B build -G Ninja             -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++             -DCMAKE_BUILD_TYPE=Debug -DOPENRAR_INMEM_ARCHIVE=ON             -DOPENRAR_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build --parallel $(nproc)
      # Exclusions, and why each one is excluded (docs/verification-legs.md):
      #   sfx_tests / sfx_e2e_tests / sandbox_sandboxed_e2e_tests - spawn
      #     child processes; the SFX containment sets RLIMIT_AS in the child,
      #     which is incompatible with the child ASan shadow. A sanitizer
      #     spawn limitation, not a finding.
      #   python_conformance - loads the DLL from non-instrumented python.
      #   transcode_tests - excluded on wall-clock budget.
      #   (archive_tests re-admitted: decoupled 16.7M PBKDF2 cycle allows <1s execution).
      - name: Unit suite under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --exclude-regex 'transcode_tests|sfx_tests|sfx_pipeline_tests|sfx_e2e_tests|sandbox_sandboxed_e2e_tests|python_conformance'

      - name: Aggregate JUnit report (v1.45 M0 gate)
        if: always()
        run: python tools/ctest_to_junit.py --log build/Testing/Temporary/LastTest.log --out build/junit-report.xml --min-tests 20

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sanitizers
          path: build/junit-report.xml
          if-no-files-found: error
          retention-days: 3

  tsan:
    # v1.30 M5: ThreadSanitizer on the threaded suites (parallel pipeline,
    # slot readers, TUI single-writer).
    name: TSan (primary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Configure (TSan)
        run: |
          cmake -B build -G Ninja             -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++             -DCMAKE_BUILD_TYPE=Debug -DOPENRAR_INMEM_ARCHIVE=ON             -DOPENRAR_SANITIZE=thread
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Threaded suites under TSan
        env:
          TSAN_OPTIONS: halt_on_error=1
        # No retry fallback. A TSan report is a real race finding, and races
        # are nondeterministic by construction - retrying until green turns
        # a primary gate into a coin flip. This previously read
        #   ... -R 'parallel_compress_tests|writer_conformance' || ... -R 'parallel_compress_tests'
        # where the second alternative re-ran the same suite and passed if the
        # retry happened to be clean, and `writer_conformance` matched nothing
        # because it is the Node suite in the separate job above, not a ctest
        # test. Coverage here is the parallel compress pipeline only; the TUI
        # and slot-reader paths are not yet instrumented under TSan.
        run: ctest --test-dir build --output-on-failure -R 'parallel_compress_tests'

      - name: Aggregate JUnit report (v1.45 M0 gate)
        if: always()
        run: python tools/ctest_to_junit.py --log build/Testing/Temporary/LastTest.log --out build/junit-report.xml --min-tests 1

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-tsan
          path: build/junit-report.xml
          if-no-files-found: error
          retention-days: 3

  msan:
    # v1.30 M5: MSan is BEST-EFFORT on the Linux/clang leg (§7.2 revised):
    # it requires an instrumented libc++, cannot gate the MSVC matrix, and
    # is reported but never blocks the release.
    name: MSan (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Install clang + instrumented libc++
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev
      - name: Configure (MSan, instrumented libc++)
        run: |
          cmake -B build -G Ninja             -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++             -DCMAKE_BUILD_TYPE=Debug -DOPENRAR_INMEM_ARCHIVE=ON             -DOPENRAR_SANITIZE=memory || true
      - name: Build (best-effort)
        run: cmake --build build --parallel $(nproc) || true
      - name: Report
        # Non-gating by design (continue-on-error above), but it must still
        # be loud. This used to be a single `if [ -d build ]; then ... fi`,
        # so a failed configure left build/ absent, skipped the whole body,
        # and exited 0 printing nothing at all - a green step that carried
        # zero information. Distinguish the three outcomes explicitly.
        run: |
          set -uo pipefail
          if [ ! -f build/CMakeCache.txt ]; then
            echo "::warning::MSan leg: CMake never configured - no MSan coverage was obtained"
            exit 0
          fi
          if ! ctest --test-dir build --output-on-failure -R 'compress_tests'; then
            echo "::warning::MSan reported findings (best-effort leg, non-gating)"
          else
            echo "MSan leg completed clean (best-effort leg, non-gating)"
          fi
          # Non-gating leg, but the conversion result must not be reported as
          # success when it failed: `|| true` plus an unconditional "written"
          # echo made a missing/empty report look like a clean conversion.
          if python tools/ctest_to_junit.py --log build/Testing/Temporary/LastTest.log --out build/junit-report.xml --min-tests 1; then
            echo "junit-report.xml written (MSan leg)"
          else
            echo "::warning::MSan leg: JUnit conversion failed; no report uploaded"
          fi

      - name: Upload JUnit report (msan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-msan
          path: build/junit-report.xml
          if-no-files-found: warn
          retention-days: 3

  # C# / .NET SDK binding: builds native library, verifies against xUnit
  # conformance suite, and packs NuGet package.
  csharp:
    name: C# binding (build, test & pack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
      - name: Build the native shared library
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENRAR_INMEM_ARCHIVE=ON
          cmake --build build --parallel $(nproc) --target openrar_dll
      - name: Build the C# binding
        run: dotnet build bindings/csharp/OpenRAR/OpenRAR.NET.csproj -c Release
      - name: Run the xUnit conformance suite
        env:
          # [DllImport("openrar")] resolves libopenrar.so from here.
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: dotnet test bindings/csharp/OpenRAR.Tests/OpenRAR.Tests.csproj -c Release
      - name: Pack NuGet package
        run: dotnet pack bindings/csharp/OpenRAR/OpenRAR.NET.csproj -c Release -o bin/pkg
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrar-nuget
          path: bin/pkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Python SDK binding: builds pure Python wheel and source distribution (sdist).
  python-sdk:
    name: Python SDK (build & package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: pip install --upgrade build
      - name: Build sdist and wheel
        run: |
          python -m build bindings/python -o dist/
          ls -la dist/
      - name: Upload Python package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openrar-python-pkg
          path: dist/
          if-no-files-found: error
          retention-days: 7

  oracle-interop:
    # Gate G1: every archive the encoder can emit (both parsers, every method) must decode
    # byte-identically under the pinned UnRAR 7.20. Fail-closed: a missing oracle, a wrong
    # banner or a hash mismatch exits non-zero.
    name: Interop vs UnRAR 7.20 (G1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          # tag v2.0.23 supplies the pinned source blob inside the big24.bin corpus
          fetch-depth: 0
          fetch-tags: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Provision UnRAR 7.20 (SHA-256 pinned)
        run: |
          sudo bash tools/provision_unrar.sh
          unrar | awk 'NF { print; exit }'
      - name: Build openrar (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target openrar --parallel $(nproc)
      - name: Run the interop manifest
        env:
          OPENRAR_BIN: ${{ github.workspace }}/build/openrar
        run: python3 tools/interop_reference.py

  release-regression-guard:
    # Directive 14: a release must not be larger, slower or less correct than the previous
    # one. Runs tools/release_regression_guard.py against the pinned v2.0.23 release binary.
    # The guard is fail-closed: a missing or mis-versioned baseline is an error, not a skip.
    name: Release regression guard (vs v2.0.23)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASELINE_TAG: v2.0.23
      BASELINE_ASSET: openrar-2.0.23-linux-gcc-x64.zip
      # sha256 of the asset as published on the v2.0.23 release.
      BASELINE_SHA256: 03cba41d00345f23499b6f1c90c9979e0b409f30f2bb0f9471a14eb14e46d1f0
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          # The v2.0.23 tag supplies the pinned source blob inside the big24.bin corpus.
          fetch-depth: 0
          fetch-tags: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build openrar (Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target openrar --parallel $(nproc)
      - name: Fetch the pinned v2.0.23 release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh release download "${BASELINE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${BASELINE_ASSET}" --dir baseline
          echo "${BASELINE_SHA256}  baseline/${BASELINE_ASSET}" | sha256sum -c -
          unzip -o -q "baseline/${BASELINE_ASSET}" -d baseline/unpacked
          BIN=$(find baseline/unpacked -type f -name openrar | head -n 1)
          test -n "${BIN}" || { echo "no openrar binary inside ${BASELINE_ASSET}"; exit 1; }
          chmod +x "${BIN}"
          "${BIN}" --version
          echo "OPENRAR_BASELINE_BIN=${PWD}/${BIN}" >> "${GITHUB_ENV}"
      - name: Run the guard
        run: python3 tools/release_regression_guard.py --binary build/openrar

  windows-regression-guard:
    # W3: Windows release regression guard (Directive 14 & Roadmap v2.2)
    # Runs tools/release_regression_guard.py on windows-2022 against the pinned v2.0.23 release binary.
    name: Windows release regression guard (vs v2.0.23)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BASELINE_TAG: v2.0.23
      BASELINE_ASSET: openrar-2.0.23-windows-msvc-x64.zip
      BASELINE_SHA256: cabad680ace93dd947969b50a0c347a8641de86c8b957b3a5fb64ce90a3f03de
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Configure CMake (Windows MSVC)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build openrar (Release)
        run: |
          cmake --build build --config Release --target openrar
      - name: Fetch the pinned v2.0.23 release binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh release download "${BASELINE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${BASELINE_ASSET}" --dir baseline
          echo "${BASELINE_SHA256}  baseline/${BASELINE_ASSET}" | sha256sum -c -
          unzip -o -q "baseline/${BASELINE_ASSET}" -d baseline/unpacked
          BIN=$(find baseline/unpacked -type f -name openrar.exe | head -n 1)
          test -n "${BIN}" || { echo "no openrar.exe binary inside ${BASELINE_ASSET}"; exit 1; }
          "${BIN}" --version
          echo "OPENRAR_BASELINE_BIN=${PWD}/${BIN}" >> "${GITHUB_ENV}"
      - name: Run the guard
        shell: bash
        run: |
          EXE="./build/openrar64/Release/openrar.exe"
          if [ ! -f "$EXE" ]; then EXE="./build/Release/openrar.exe"; fi
          python3 tools/release_regression_guard.py --binary "$EXE"

  release-assets:
    name: Attach release artifacts
    # Runs only for version tags: packages everything the run built and
    # attaches it to the GitHub release named after the tag (creating the
    # release with generated notes if it does not exist yet).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, linux-arm64-qemu, wasm, sanitizers, tsan, simd-validation, csharp, python-sdk, release-regression-guard, windows-regression-guard, oracle-interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore keyless attestation (actions/attest-build-provenance)
      attestations: write # persist the attestation to the repository's attestation store
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0

      - name: Package and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job downloads artifacts without a checkout, so gh has no git
          # remote to resolve the repository from — pin it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # Extract packages and deb files from artifacts to attach directly
          # to the release. globstar's `**/` also matches zero directories.
          shopt -s globstar nullglob
          for deb in openrar-native-*/**/*.deb; do
            mv "$deb" .
          done
          for nupkg in openrar-nuget*/**/*.nupkg; do
            mv "$nupkg" .
          done
          for py in openrar-python-pkg*/*; do
            mv "$py" .
          done
          for tgz in openrar-wasm*/**/*.tgz; do
            mv "$tgz" .
          done

          # Release zips carry the platform shared library (.dll / .so / .dylib),
          # its import library where the platform has one, and the CLI
          # executable — test-target static libs (openrar_core.lib,
          # openrar_core.a, *_check.lib) are CI artifacts, not release assets.
          # Asset names are platform-identified, not "dll": the library form
          # differs per platform, so no type segment in the name (the wasm
          # module keeps its explicit label).
          find . -type f \( -name 'openrar_core.lib' -o -name 'openrar_core.a' -o -name 'openrar_*_check.lib' \) -delete

          for d in openrar-native-* openrar-wasm; do
            short=$(echo "$d" | sed -e 's|^openrar-native-||' \
                                    -e 's|^openrar-wasm$|wasm|' \
                                    -e 's|ubuntu-[0-9.]*|linux|' \
                                    -e 's|ubuntu-latest|linux|' \
                                    -e 's|macos-latest|macos|' \
                                    -e 's|windows-2022|windows|' \
                                    -e 's|-arm64-arm64|-arm64|')
            zip -qr "openrar-${VER}-${short}.zip" "$d"
          done

          # nullglob turns an unmatched glob into zero words, so a missing
          # artifact would otherwise fall through to `sha256sum` with no file
          # operands and publish an empty SHA256SUMS (R1 silent degradation).
          zips=(openrar-${VER}-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::no release zips were produced; refusing to publish empty assets"
            exit 1
          fi

          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "OpenRAR ${VER}" --generate-notes
          gh release upload "$TAG" --clobber openrar-${VER}-*.zip
          extra_files=(*.deb *.nupkg *.whl *.tar.gz *.tgz)
          if [ ${#extra_files[@]} -gt 0 ]; then
            gh release upload "$TAG" --clobber "${extra_files[@]}"
          fi

          # Supply chain (v1.30 M6; freeze prereq 5): checksums + SBOM.
          sha256sum openrar-${VER}-*.zip "${extra_files[@]}" > SHA256SUMS
          gh release upload "$TAG" --clobber SHA256SUMS
          # SBOM tool. Pinned to an exact release AND checksum-verified.
          SYFT_VERSION=1.54.1
          SYFT_SHA256=c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47
          curl -sSfL -o /tmp/syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
          syft dir:. -o cyclonedx-json > openrar-${VER}-sbom.json
          gh release upload "$TAG" --clobber openrar-${VER}-sbom.json

      - name: Attest build provenance (Sigstore keyless)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # Every subject is a workspace-ROOT file: the zips are created by
          # `zip -qr` in the job root (NOT inside the downloaded artifact
          # directories), and SHA256SUMS + the SBOM are written there too.
          subject-path: |
            openrar-*.zip
            *.deb
            *.nupkg
            *.whl
            *.tar.gz
            *.tgz
            SHA256SUMS
            openrar-*-sbom.json

  # ───────────────────────────────────────────────────────────────────────────
  # Ecosystem Registries Publishing (PyPI, NuGet, NPM)
  # Triggered exclusively on version tag pushes (v*) after release-assets.
  # Gracefully reports missing repository secrets without failing the pipeline.
  # ───────────────────────────────────────────────────────────────────────────

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: [release-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/openrar
    permissions:
      id-token: write # Required for PyPI OIDC Trusted Publishing
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openrar-python-pkg
          path: dist/

      - name: Publish to PyPI via Token (if configured)
        id: token_publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_TOKEN}" ]; then
            echo "Publishing via configured PYPI_API_TOKEN..."
            python -m pip install --upgrade twine
            twine upload --non-interactive --skip-existing -u __token__ -p "${PYPI_TOKEN}" dist/*
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "PYPI_API_TOKEN secret not set."
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        if: steps.token_publish.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  publish-nuget:
    name: Publish .NET SDK (GitHub Packages + NuGet.org)
    needs: [release-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # nuget.pkg.github.com, authenticated by GITHUB_TOKEN
      id-token: write # nuget.org trusted publishing: GitHub OIDC token
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openrar-nuget
          path: pkg/

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Push to GitHub Packages
        # No repository secret required: GITHUB_TOKEN with packages:write is
        # enough, so a tagged release always lands somewhere installable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          dotnet nuget push "pkg/*.nupkg" \
            --api-key "${GITHUB_TOKEN}" \
            --source "https://nuget.pkg.github.com/${OWNER}/index.json" \
            --skip-duplicate

      - name: Check nuget.org trusted publishing is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::NUGET_USER is not set. Trusted publishing needs the nuget.org profile name (not the email) of the account that owns the policy."
            echo "Set it with: gh secret set NUGET_USER --repo ${GITHUB_REPOSITORY:-geometric-dev/openrar}"
            exit 1
          fi

      - name: NuGet login (OIDC to temporary API key)
        # Exchanges the GitHub OIDC token for a short-lived nuget.org key scoped
        # to this workflow. Nothing to rotate: the key dies with the job, and the
        # policy on nuget.org names this repository and workflow file.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          set -euo pipefail
          echo "Pushing packages to NuGet.org..."
          dotnet nuget push "pkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-npm:
    name: Publish WASM SDK to NPM
    needs: [release-assets]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance attestation
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm CLI >= 11.5.1.
          # No registry-url on purpose: it writes a `//registry.npmjs.org/:
          # _authToken=${NODE_AUTH_TOKEN}` line into .npmrc, and npm treats any
          # _authToken — even one that expands to the empty string — as "auth is
          # configured" and skips the OIDC exchange entirely.
          node-version: '24'

      - name: Download WASM package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openrar-wasm
          path: wasm-pkg/

      - name: Verify the npm trusted publisher (OIDC exchange)
        # Proves this repository+workflow is accepted for the package before
        # anything is published. The exchange endpoint only issues a short-lived
        # publish token when a trusted publisher matches, so this is the same
        # check a publish performs — and it still runs when the version is
        # already on the registry and the publish below is skipped.
        run: |
          set -euo pipefail
          pkg=$(ls wasm-pkg/*.tgz | head -1)
          name=$(tar -xzOf "${pkg}" package/package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          id_token=$(curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).value")
          code=$(curl -sS -o /tmp/oidc-exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${id_token}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name}")
          # The registry answers 201 Created with token_type "oidc" for a
          # matching trusted publisher; any 2xx is acceptance.
          case "${code}" in
            2*)
              echo "Trusted publisher accepted the OIDC exchange for ${name}"
              ;;
            *)
              echo "::error::The npm trusted publisher rejected the OIDC exchange for ${name} (HTTP ${code}). Check that the publisher names repository ${GITHUB_REPOSITORY}, workflow build.yml, an empty environment, and allows npm publish (a new publisher is stage-only by default)."
              cat /tmp/oidc-exchange.json || true
              exit 1
              ;;
          esac

      - name: Publish to npmjs.org (trusted publishing)
        # OIDC is the only credential this job may use. A token would take
        # precedence and silently disable trusted publishing, so the publish
        # path actively drops any token the runner has.
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "npm $(npm --version)"
          for pkg in wasm-pkg/*.tgz; do
            # Re-running a tag (to replace assets, for example) must not fail on
            # a version that is already published: npm has no --skip-existing.
            name=$(tar -xzOf "${pkg}" package/package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            ver=$(tar -xzOf "${pkg}" package/package.json | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${ver} is already on npmjs.org; skipping"
              continue
            fi
            # "./" matters: a bare "dir/file.tgz" is parsed by npm as a
            # GitHub shorthand (owner/repo) and it tries to clone it.
            if ! npm publish "./${pkg}" --provenance --access public; then
              echo "::error::npm publish ${name}@${ver} failed. On ENEEDAUTH, check that ${name}'s trusted publisher names repository ${GITHUB_REPOSITORY}, workflow build.yml, and allows npm publish (a new publisher is stage-only by default)."
              exit 1
            fi
          done

  verify-published:
    name: Verify published packages install
    # A release claims two things: the SDKs are on the public registries, and a
    # consumer can install this exact version. Registry indexing lags the push,
    # hence the bounded waits rather than a single request.
    needs: [publish-nuget, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Verify openrar-wasm installs from npmjs.org
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=openrar-wasm
          REGISTRY=https://registry.npmjs.org
          found=0
          # 2.4.0 took 3.5 minutes between "publish" and its tarball being
          # served, so allow 10 minutes like the nuget check.
          for _ in $(seq 1 60); do
            if npm view "${PKG}@${VERSION}" version --registry "$REGISTRY" >/dev/null 2>&1; then
              found=1
              break
            fi
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::${PKG}@${VERSION} is not resolvable from npmjs.org after 10 minutes"
            exit 1
          fi
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --registry "$REGISTRY" "${PKG}@${VERSION}"
          installed=$(node -pe "require('./node_modules/${PKG}/package.json').version")
          if [ "$installed" != "$VERSION" ]; then
            echo "::error::installed ${PKG}@${installed}, expected ${VERSION}"
            exit 1
          fi
          echo "installed ${PKG}@${installed} from npmjs.org"

      - name: Verify OpenRAR.NET installs from nuget.org
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ID=OpenRAR.NET
          LOWER=$(echo "$ID" | tr '[:upper:]' '[:lower:]')
          FLAT="https://api.nuget.org/v3-flatcontainer/${LOWER}/${VERSION}/${LOWER}.${VERSION}.nupkg"
          found=0
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$FLAT")" = "200" ]; then
              found=1
              break
            fi
            sleep 10
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::${ID} ${VERSION} is not on nuget.org after 10 minutes"
            exit 1
          fi
          work="$(mktemp -d)"
          cd "$work"
          dotnet new console -o consumer >/dev/null
          dotnet add consumer package "$ID" --version "$VERSION" \
            --source https://api.nuget.org/v3/index.json
          dotnet build consumer --configuration Release --nologo -v minimal
          echo "restored and built a consumer of ${ID} ${VERSION} from nuget.org"
