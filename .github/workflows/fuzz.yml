name: Nightly Fuzzing & Sanitizers

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC daily
  workflow_dispatch: # Allow manual trigger

jobs:
  fuzz:
    name: Continuous Fuzzing
    runs-on: ubuntu-latest
    env:
      UBSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Create seeds directory
        run: mkdir -p tests/fuzz/seeds

      - name: Restore fuzzer corpus
        # Persist the corpus across nightly runs so coverage accumulates
        # instead of restarting from the dummy seed every night.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/fuzz/seeds
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Install clang
        # The libFuzzer harnesses are Clang-only (CMakeLists.txt gates
        # OPENRAR_USE_LIBFUZZER on the compiler ID). Ubuntu's default CMake
        # compiler is GCC, which silently skipped the libFuzzer wiring and
        # degraded the nightly to the seconds-long standalone sweep (R1).
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure CMake (Fuzzing enabled)
        run: |
          cmake -B build_fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENRAR_FUZZ=ON \
            -DOPENRAR_SANITIZERS=ON \
            -DOPENRAR_CROSS_VALIDATE=ON

      - name: Build Fuzzers
        run: cmake --build build_fuzz --parallel

      - name: Assert libFuzzer harnesses built (not the standalone fallback)
        # The -max_total_time flags below are libFuzzer flags; the standalone
        # main() fallback ignores them, so a silent fallback would burn the
        # nightly on a fixed 2000-iteration sweep while CI reported success.
        run: |
          for f in fuzz_decompress fuzz_archive fuzz_file_handle; do
            if ! strings ./build_fuzz/$f | grep -q libFuzzer; then
              echo "::error::$f was built without libFuzzer (standalone fallback — check the compiler wiring above)"
              exit 1
            fi
          done

      - name: Run Roundtrip Fuzzer (Deterministic Sweep)
        # fuzz_roundtrip keeps its own main(): a fixed deterministic sweep,
        # not a libFuzzer target — safe to run without a time limit.
        run: ./build_fuzz/fuzz_roundtrip

      - name: Run Decoder Fuzzer (libFuzzer mode)
        # The explicit clang compilers above make CMake define
        # OPENRAR_USE_LIBFUZZER and link -fsanitize=fuzzer (see
        # CMakeLists.txt), so this is a real 30-minute libFuzzer run over
        # the accumulated corpus, saving new inputs back into tests/fuzz/seeds/.
        # tests/*.rar fixtures are passed as read-only extra seeds (valid RAR5
        # header shapes; libFuzzer writes new units only into the first dir).
        # -timeout=60 tolerates hostile lg2_count=24 PBKDF2 derivations (~seconds)
        # in the file-handle harness without flagging them as timeouts.
        run: ./build_fuzz/fuzz_decompress -max_total_time=1800 tests/fuzz/seeds/ tests/*.rar
      - name: Fuzz archive + block C ABI (30 min)
        run: ./build_fuzz/fuzz_archive -max_total_time=1800 tests/fuzz/seeds/ tests/*.rar
      - name: Fuzz file-based surface (30 min)
        # open_file / handle_extract_to_path / handle_test / list_file_pw over
        # the streaming reader: volume scan, extent stitching, chunked decrypt,
        # solid catch-up. Archives are materialised to disk with hostile
        # naming variants per input (see tests/fuzz/fuzz_file_handle.cpp).
        run: ./build_fuzz/fuzz_file_handle -max_total_time=1800 -timeout=60 tests/fuzz/seeds/ tests/*.rar

      - name: Upload new seeds (if any crashes or coverage expanded)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzzer-corpus
          path: tests/fuzz/seeds/
