[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrar"
version = "1.30.4"
description = "OpenRAR Python SDK — ctypes binding over the frozen OpenRAR C ABI (RAR 5.0 read/create/mutate)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpenRAR Project" }]
urls = { Homepage = "https://github.com/geometric-dev/openrar" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.setuptools]
packages = ["openrar"]

# Wheel packaging note (plan M4): the platform wheels bundle the built
# shared library beside the package; the conformance suite runs against the
# packaged artifact at least once per platform in CI (auditwheel/delocate
# policy gates live in the release workflow).
