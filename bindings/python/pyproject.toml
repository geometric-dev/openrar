[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrar"
version = "1.56.0"
description = "OpenRAR Python SDK — ctypes binding over the frozen OpenRAR C ABI (RAR 5.0 read/create/mutate)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpenRAR Project" }]
urls = { Homepage = "https://github.com/geometric-dev/openrar" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.setuptools]
packages = ["openrar"]

# Platform wheels bundle the built shared library beside the package (the
# release workflow copies it into openrar/ before `python -m build`). Without
# this declaration the wheel never contains the library, and load_native()
# fails for every installed user - which is what the previous state did (the
# note below described the mechanism but nothing implemented it).
[tool.setuptools.package-data]
openrar = ["*.so", "*.so.*", "*.dylib", "*.dll"]
